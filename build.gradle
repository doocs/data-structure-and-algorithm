plugins {
    id 'java'
}

group 'io.github.doocs'
version '1.0-SNAPSHOT'

sourceCompatibility = 1.8

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.4'
    // Align Gradle's test worker with the JUnit Platform that Jupiter 5.14 brings in.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

test {
    useJUnitPlatform()
}
